# Base de datos y Redis para desarrollo local (alternativa a instalarlos con Homebrew).
# Uso: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: estoicos
      POSTGRES_PASSWORD: estoicos
      POSTGRES_DB: estoicos_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  redis:
    image: redis:7
    # BullMQ exige noeviction; AOF para no perder jobs si Redis se reinicia.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
